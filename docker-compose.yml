services:
  redis:
    image: redis:7-alpine
    container_name: sharetext-redis
    restart: unless-stopped
    ports:
      # Host port 6380 by default: 6379 is commonly already taken by another
      # project's Redis. Override with REDIS_PORT if you want something else.
      - "${REDIS_PORT:-6380}:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
