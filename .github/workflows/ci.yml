name: CI

on:
  push:
    branches: [main]
  pull_request:

# The whole product rests on web/static/js/crypto.mjs. If that file breaks the
# server cannot notice — it has no key and cannot decrypt anything by design —
# so the browser-side suite is the only thing standing between a bad commit and
# silently unreadable pastes. It runs here because it deliberately does not run
# on the production box.
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt reports no unformatted files
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./web)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"; echo "$unformatted"; exit 1
          fi
      - run: go test ./...
        env:
          REDIS_ADDR: 127.0.0.1:6380

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Zero dependencies by design: node:test plus the WebCrypto globals, the
      # same APIs the browser provides. Nothing to install.
      - run: node --test test/*.test.mjs
